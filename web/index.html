<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17395d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SCI Ruvelon">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SCI RUVELON GESTION</title>
  <link rel="manifest" href="./manifest.webmanifest?v=9">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <section id="login" class="login-screen">
    <div class="login-card">
      <div class="app-mark">SCI</div>
      <h1>SCI RUVELON</h1>
      <p>Gestion locative</p>
      <div id="config-warning" class="notice warning" hidden>
        La base en ligne n'est pas encore configuree. Vous pouvez utiliser le mode apercu local.
      </div>
      <form id="login-form">
        <label>Email</label>
        <input id="login-email" type="email" autocomplete="email" value="bidal.michel2@gmail.com">
        <label>Mot de passe</label>
        <input id="login-password" type="password" autocomplete="current-password">
        <button class="primary" type="submit">Se connecter</button>
      </form>
      <button id="magic-link-btn" class="secondary" type="button">Recevoir un lien de connexion</button>
      <button id="local-preview-btn" class="ghost" type="button">Mode apercu local</button>
      <div id="login-message" class="login-message"></div>
    </div>
  </section>

  <section id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">SCI RUVELON<br>GESTION</div>
        <div class="sidebar-sub">Pilotage MEG</div>
      </div>
      <div class="sidebar-user">
        <span class="user-dot"></span>
        <div>
          <strong id="sidebar-user-name">Michel Bidal</strong>
          <small id="sidebar-user-role">Administrateur</small>
        </div>
      </div>
      <nav class="app-nav" aria-label="Navigation principale">
        <button data-route="dashboard" class="active"><span>⌂</span><strong>Tableau de bord</strong></button>
        <button data-route="pointage"><span>€</span><strong>Pointage MEG</strong></button>
        <button data-route="locaux"><span>▦</span><strong>Locaux</strong></button>
        <button data-route="locataires"><span>◎</span><strong>Locataires</strong></button>
        <button data-route="baux"><span>□</span><strong>Baux</strong></button>
        <button data-route="travaux"><span>!</span><strong>Travaux</strong></button>
        <button data-route="remuneration"><span>%</span><strong>Rémunération</strong></button>
        <button data-route="plus"><span>＋</span><strong>Plus</strong></button>
      </nav>
    </aside>

    <div class="main-area">
      <header class="app-header">
        <div>
          <div class="eyebrow">SCI RUVELON</div>
          <h2 id="screen-title">Tableau de bord</h2>
        </div>
        <button id="install-btn" class="icon-btn" type="button" title="Installer sur telephone" aria-label="Installer sur telephone">↓</button>
      </header>

      <main id="screen" class="screen"></main>
    </div>
  </section>

  <div id="modal" class="modal-layer" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">Saisie</h3>
        <button id="modal-close" class="icon-btn" type="button">X</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=8"></script>
</body>
</html>
